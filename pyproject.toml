[build-system]
requires = ["setuptools>=68.0", "torch>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ph-neuro"
version = "0.1.0.dev0"
description = "Ternary Hebbian deep learning — no backpropagation"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "PH-Neuro Contributors"},
]
requires-python = ">=3.10"
keywords = [
    "hebbian", "ternary", "deep-learning", "backprop-free",
    "neural-networks", "research",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
memory = [
    "bitsandbytes>=0.43.0",
]
examples = [
    "matplotlib>=3.7.0",
    "tqdm>=4.66.0",
]
all = [
    "ph-neuro[dev,examples]",
]

[project.urls]
Homepage = "https://github.com/kainotomo/PH-Neuro"
Repository = "https://github.com/kainotomo/PH-Neuro"
Documentation = "https://github.com/kainotomo/PH-Neuro"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ph_neuro*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true
exclude = [
    "src/ph_neuro/examples/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a CUDA GPU (deselect with '-m \"not gpu\"')",
    "experiment: marks experiment scripts, not unit tests",
]
filterwarnings = [
    "ignore::UserWarning",
]
